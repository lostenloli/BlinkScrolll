name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unzip & build
        run: |
          unzip -oq *.zip
          cd "$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")"
          if grep -q 'java.net.URL(url)' app/build.gradle.kts; then
            sed -i 's/java\.net\.URL(url)/URL(url)/' app/build.gradle.kts
            sed -i '1i import java.net.URL' app/build.gradle.kts
          fi
          gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/BlinkScroll.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BlinkScroll
          files: BlinkScroll.apk
